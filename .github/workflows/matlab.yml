name: Native MATLAB validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); test_dsss; run_experiments('results/matlab',12000); advanced_demo('results/matlab');
      - uses: actions/upload-artifact@v4
        with:
          name: native-matlab-results
          path: results/matlab
