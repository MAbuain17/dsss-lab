[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsss-lab"
version = "0.1.0"
description = "Hardware-grounded DSSS laboratory with reproducible Python and MATLAB experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]
authors = [{name = "Mohamed Abuain"}]

[tool.setuptools.packages.find]
where = ["src"]
